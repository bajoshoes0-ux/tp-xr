
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TP2 - Salle XR interactive</title>

<!-- A-Frame 1.7.1 -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-v1.7.1.min.js"></script>

<style>
    body {
        margin: 0;
        overflow: hidden;
    }

    #hud {
        position: fixed;
        bottom: 8px;
        left: 8px;
        right: 8px;
        z-index: 10;
        pointer-events: none;
        font: 600 16px system-ui, sans-serif;
        color: #fff;
        text-align: center;
        text-shadow: 0 0 4px #000, 0 0 4px #000;
    }
</style>

<script>
/* ==========================================
   COMPOSANT : TELEPORTATION
========================================== */

AFRAME.registerComponent('teleport-sol', {

    init: function () {

        this.el.addEventListener('click', (event) => {

            const intersection = event.detail.intersection;

            if (!intersection) return;

            const point = intersection.point;

            const rig = document.getElementById('rig');

            if (!rig) return;

            // Déplacement du rig sur le sol
            rig.setAttribute('position', {
                x: point.x,
                y: 0,
                z: point.z
            });

            document.getElementById('hud').textContent =
                "Téléportation effectuée !";
        });

    }

});
</script>

</head>

<body>

<div id="hud">
    Visez avec le point blanc, touchez l'écran pour agir.
</div>

<a-scene
    id="scene"
    vr-mode-ui="enabled: false"
    renderer="antialias: true"
>

<!-- ==========================================
     BLOC 1 : ENVIRONNEMENT
========================================== -->

<a-entity id="Environnement">

    <!-- CIEL -->
    <a-sky color="#9ec9ee"></a-sky>

    <!-- LUMIÈRE AMBIANTE -->
    <a-entity
        light="type: ambient; intensity: 0.7">
    </a-entity>

    <!-- LUMIÈRE DIRECTIONNELLE -->
    <a-entity
        light="type: directional; intensity: 0.8"
        position="1 4 2">
    </a-entity>

    <!-- SOL -->
    <a-plane
        id="Sol"
        class="interactif"
        teleport-sol
        rotation="-90 0 0"
        width="6"
        height="6"
        material="color: #c9c9c9; roughness: 0.9">
    </a-plane>

    <!-- MURS -->
    <a-plane
        position="0 1.5 -3"
        width="6"
        height="3"
        material="color: #e8eef5">
    </a-plane>

    <a-plane
        position="-3 1.5 0"
        rotation="0 90 0"
        width="6"
        height="3"
        material="color: #e8eef5">
    </a-plane>

    <a-plane
        position="3 1.5 0"
        rotation="0 -90 0"
        width="6"
        height="3"
        material="color: #e8eef5">
    </a-plane>

    <a-plane
        position="0 1.5 3"
        rotation="0 180 0"
        width="6"
        height="3"
        material="color: #e8eef5">
    </a-plane>


    <!-- ======================================
         TABLE A : INSTRUMENTS
    ====================================== -->

    <a-entity id="Table_A" position="-0.6 0 -1">

        <!-- PLATEAU -->
        <a-box
            class="interactif"
            position="0 0.725 0"
            width="1"
            height="0.05"
            depth="0.6"
            material="color: #8d6e63; roughness: 0.8">
        </a-box>

        <!-- QUATRE PIEDS -->
        <a-box position="-0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

        <a-box position="0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

        <a-box position="-0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

        <a-box position="0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

    </a-entity>


    <!-- ======================================
         TABLE B : ZONES DE DÉPÔT
    ====================================== -->

    <a-entity id="Table_B" position="0.6 0 -1">

        <!-- PLATEAU -->
        <a-box
            class="interactif"
            position="0 0.725 0"
            width="1"
            height="0.05"
            depth="0.6"
            material="color: #eceff1; roughness: 0.5">
        </a-box>

        <!-- QUATRE PIEDS -->
        <a-box position="-0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

        <a-box position="0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

        <a-box position="-0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

        <a-box position="0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

    </a-entity>


    <!-- ======================================
         PANNEAU DE MISSION
    ====================================== -->

    <a-plane
        position="0 2.0 -2.95"
        width="2.4"
        height="0.9"
        material="color: #1b2a41; shader: flat">
    </a-plane>

    <a-text
        id="Panneau"
        position="0 2.0 -2.93"
        width="2.2"
        align="center"
        color="#ffffff"
        value="Salle de formation&#10;Placez chaque instrument&#10;dans sa zone.">
    </a-text>

    <a-text
        position="0 2.55 -2.93"
        width="2.2"
        align="center"
        color="#ffd54f"
        value="Prototype pédagogique - pas un dispositif médical">
    </a-text>

</a-entity>

    <!-- ============ BLOC 2 : ZONES DE DÉPÔT ============ -->
<a-entity id="Zones">
<a-cylinder id="zone_bistouri" class="interactif" zone-depot position="0.3 0.755 -1" radius="0.1"
height="0.01" color="#ef9a9a"></a-cylinder>
<a-cylinder id="zone_pince" class="interactif" zone-depot position="0.6 0.755 -1" radius="0.1"
height="0.01" color="#90caf9"></a-cylinder>
<a-cylinder id="zone_ecarteur" class="interactif" zone-depot position="0.9 0.755 -1" radius="0.1"
height="0.01" color="#a5d6a7"></a-cylinder>
<a-text position="0.3 0.9 -1" width="0.7" align="center" value="Bistouri"></a-text>
<a-text position="0.6 0.9 -1" width="0.7" align="center" value="Pince"></a-text>
<a-text position="0.9 0.9 -1" width="0.7" align="center" value="Écarteur"></a-text>
</a-entity>
<!-- ============ BLOC 3 : OBJETS INTERACTIFS (instruments) ============ -->
<!-- Tailles >= 8 cm : visables facilement à ~2 m (voir TP3) -->
<a-entity id="Instruments">
<a-box id="bistouri" class="interactif" instrument="nom: Bistouri; zone: zone_bistouri"
position="-0.9 0.82 -1" width="0.22" height="0.08" depth="0.08" material="color: #e53935;
metalness: 0.3; roughness: 0.4"></a-box>
<a-cylinder id="pince" class="interactif" instrument="nom: Pince; zone: zone_pince"
position="-0.6 0.84 -1" rotation="0 0 90" radius="0.05" height="0.2" material="color: #1e88e5;
metalness: 0.3; roughness: 0.4"></a-cylinder>
<a-cone id="ecarteur" class="interactif" instrument="nom: Écarteur; zone: zone_ecarteur"
position="-0.3 0.83 -1" radius-bottom="0.07" radius-top="0" height="0.15" material="color:
#43a047; metalness: 0.3; roughness: 0.4"></a-cone>
</a-entity


<!-- ==========================================
     BLOC 4 : XR ORIGIN (RIG)
========================================== -->

<a-entity
    id="rig"
    position="0 0 0.8"
    wasd-controls="acceleration: 15">

    <!-- CAMÉRA -->
    <a-entity
        id="tete"
        camera
        position="0 1.6 0"
        look-controls>

        <!-- CURSEUR XR -->
        <a-entity
            id="curseur"
            cursor="fuse: false"
            raycaster="objects: .interactif; far: 8"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
            material="color: #ffffff; shader: flat; opacity: 0.9">
        </a-entity>

    </a-entity>

</a-entity>

</a-scene>


<!-- ==========================================
     SCRIPT : INTERACTIONS
========================================== -->

<script>

document.addEventListener('DOMContentLoaded', function () {

    const hud = document.getElementById('hud');

    const tableA = document.querySelector('#Table_A .interactif');
    const tableB = document.querySelector('#Table_B .interactif');

    // Interaction avec Table A
    tableA.addEventListener('click', function () {

        hud.textContent = "Table A : instruments sélectionnés.";

    });

    // Interaction avec Table B
    tableB.addEventListener('click', function () {

        hud.textContent = "Table B : zone de dépôt sélectionnée.";

    });

    console.log("Salle XR interactive chargée avec succès.");

});


    
const THREE = AFRAME.THREE;

/* =================================================
   1. OUTILS : SON ET VIBRATION
================================================= */

let ctxAudio = null;

function bip(freq = 660, duree = 0.12) {
    try {
        ctxAudio = ctxAudio || new (
            window.AudioContext || window.webkitAudioContext
        )();

        if (ctxAudio.state === 'suspended') {
            ctxAudio.resume();
        }

        const o = ctxAudio.createOscillator();
        const g = ctxAudio.createGain();

        o.frequency.value = freq;
        g.gain.value = 0.15;

        o.connect(g);
        g.connect(ctxAudio.destination);

        o.start();
        o.stop(ctxAudio.currentTime + duree);

    } catch (e) {
        console.warn('Audio non disponible :', e);
    }
}

function vibrer(motif) {
    if (navigator.vibrate) {
        navigator.vibrate(motif);
    }
}


/* =================================================
   2. ÉTAT GLOBAL DU JEU
================================================= */

const jeu = {
    main: null,
    score: 0,
    erreurs: 0,
    t0: null,
    fini: false
};

const hud = document.getElementById('hud');

function majPanneau(msg) {

    const panneau = document.getElementById('Panneau');

    if (panneau) {
        panneau.setAttribute(
            'text',
            'value',
            'Score : ' + jeu.score + ' / 3\n' +
            'Erreurs : ' + jeu.erreurs + '\n' +
            msg
        );
    }

    if (hud) {
        hud.textContent =
            (jeu.main
                ? 'En main : ' +
                  jeu.main.components.instrument.data.nom +
                  ' - touchez sa zone'
                : 'Touchez un instrument pour le saisir'
            ) +
            ' | Score ' + jeu.score + '/3' +
            ' | Erreurs ' + jeu.erreurs;
    }
}


/* =================================================
   3. TÉLÉPORTATION
================================================= */

AFRAME.registerComponent('teleport-sol', {

    init() {

        this.el.addEventListener('click', e => {

            if (!e.detail || !e.detail.intersection) {
                return;
            }

            const p = e.detail.intersection.point;

            const rig = document.getElementById('rig');

            if (!rig) return;

            const x = Math.max(-2.4, Math.min(2.4, p.x));
            const z = Math.max(-2.4, Math.min(2.4, p.z));

            // Déplacement du XR Origin (rig)
            rig.object3D.position.set(x, 0, z);

            bip(440, 0.08);
        });
    }
});


/* =================================================
   4. COMPOSANT INSTRUMENT
   Machine à états :
   libre -> survole -> saisi -> depose
================================================= */

AFRAME.registerComponent('instrument', {

    schema: {
        nom: { type: 'string' },
        zone: { type: 'string' }
    },

    init() {

        this.etat = 'libre';

        // Sauvegarde de la position initiale
        this.posInit = this.el.object3D.position.clone();
        this.rotInit = this.el.object3D.rotation.clone();

        // Survol de l'instrument
        this.el.addEventListener('mouseenter', () => {

            if (this.etat === 'libre') {
                this.setEtat('survole');
            }

        });

        // Fin du survol
        this.el.addEventListener('mouseleave', () => {

            if (this.etat === 'survole') {
                this.setEtat('libre');
            }

        });

        // Sélection de l'instrument
        this.el.addEventListener('click', () => {

            if (jeu.fini) return;

            if (this.etat === 'depose') return;

            if (this.etat === 'saisi') {

                this.relacher();

            } else if (!jeu.main) {

                this.saisir();

            }

        });
    },


    // Changement d'état et retour visuel
    setEtat(e) {

        this.etat = e;

        this.el.setAttribute(
            'material',
            'emissive',
            e === 'survole' ? '#ffee58' : '#000000'
        );

        this.el.setAttribute(
            'material',
            'emissiveIntensity',
            e === 'survole' ? 0.6 : 0
        );
    },


    // Saisir l'instrument
    saisir() {

        if (!jeu.t0) {
            jeu.t0 = performance.now();
        }

        const tete = document.getElementById('tete');

        if (!tete) return;

        // L'instrument devient enfant de la caméra
        tete.object3D.attach(this.el.object3D);

        // Position en bas à droite
        this.el.object3D.position.set(
            0.22,
            -0.22,
            -0.7
        );

        this.el.object3D.rotation.set(0, 0, 0);

        // Le rayon ignore l'objet tenu
        this.el.classList.remove('interactif');

        jeu.main = this.el;

        this.setEtat('saisi');

        bip(520);
        vibrer(30);

        majPanneau('Vous tenez : ' + this.data.nom);
    },


    // Annuler la saisie
    relacher() {

        const scene = document.getElementById('scene');

        if (!scene) return;

        // Retour dans la scène
        scene.object3D.attach(this.el.object3D);

        this.el.object3D.position.copy(this.posInit);
        this.el.object3D.rotation.copy(this.rotInit);

        this.el.classList.add('interactif');

        jeu.main = null;

        this.setEtat('libre');

        bip(330, 0.1);

        majPanneau('Instrument reposé.');
    },


    // Déposer dans la bonne zone
    deposer(zoneEl) {

        const p = new THREE.Vector3();

        zoneEl.object3D.getWorldPosition(p);

        const scene = document.getElementById('scene');

        scene.object3D.attach(this.el.object3D);

        this.el.object3D.position.set(
            p.x,
            p.y + 0.06,
            p.z
        );

        this.el.object3D.rotation.set(0, 0, 0);

        this.el.classList.remove('interactif');

        jeu.main = null;

        this.setEtat('depose');
    }

});


/* =================================================
   5. ZONE DE DÉPÔT
   Vérification de la bonne zone
================================================= */

AFRAME.registerComponent('zone-depot', {

    init() {

        this.el.addEventListener('click', () => {

            if (!jeu.main || jeu.fini) return;

            const inst = jeu.main.components.instrument;

            // Vérifier si la zone est correcte
            if (inst.data.zone === this.el.id) {

                // Dépôt correct
                inst.deposer(this.el);

                jeu.score++;

                bip(880, 0.2);
                vibrer([40, 60, 40]);

                this.el.setAttribute(
                    'material',
                    'color',
                    '#2e7d32'
                );

                // Mission terminée
                if (jeu.score === 3) {

                    jeu.fini = true;

                    const secondes = (
                        (performance.now() - jeu.t0) / 1000
                    ).toFixed(0);

                    majPanneau(
                        'TERMINÉ en ' + secondes + ' secondes !'
                    );

                    console.log(
                        'RESULTAT',
                        JSON.stringify({
                            secondes: Number(secondes),
                            erreurs: jeu.erreurs
                        })
                    );

                } else {

                    majPanneau('Bien joué !');

                }

            } else {

                // Mauvaise zone
                jeu.erreurs++;

                bip(180, 0.3);
                vibrer([100, 50, 100]);

                const ancienne =
                    this.el.getAttribute('material').color;

                this.el.setAttribute(
                    'material',
                    'color',
                    '#d32f2f'
                );

                setTimeout(() => {

                    this.el.setAttribute(
                        'material',
                        'color',
                        ancienne
                    );

                }, 500);

                // Retour à la position initiale
                inst.relacher();

                majPanneau('Mauvaise zone. Réessayez.');

            }

        });
    }

});


/* =================================================
   6. MESURE DES PERFORMANCES
================================================= */

// ?stats : afficher FPS et triangles
// ?stress=200 : ajouter 200 sphères

const params = new URLSearchParams(location.search);

const sceneEl = document.getElementById('scene');

// Afficher les statistiques
if (params.has('stats')) {

    sceneEl.setAttribute('stats', '');

}

// Nombre de sphères de test
const nbStress = Math.max(
    0,
    Math.min(
        1000,
        parseInt(params.get('stress') || '0', 10) || 0
    )
);

// Création des sphères
for (let i = 0; i < nbStress; i++) {

    const s = document.createElement('a-sphere');

    s.setAttribute('radius', 0.08);

    s.setAttribute('segments-width', 32);
    s.setAttribute('segments-height', 32);

    s.setAttribute('position', {
        x: (Math.random() - 0.5) * 5,
        y: 0.3 + Math.random() * 2.5,
        z: (Math.random() - 0.5) * 5
    });

    s.setAttribute(
        'material',
        'color: #9575cd; metalness: 0.5; roughness: 0.3'
    );

    sceneEl.appendChild(s);

}


/* =================================================
   7. INITIALISATION
================================================= */

sceneEl.addEventListener('loaded', () => {

    majPanneau('Saisissez un instrument.');

});


</script>

</body>
</html>
