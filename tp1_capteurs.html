
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TP1 - Capteurs du smartphone</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 16px;
            font-size: 18px;
        }

        pre {
            background: #eef;
            padding: 12px;
            border-radius: 8px;
            font-size: 17px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        button {
            font-size: 20px;
            padding: 12px 18px;
            margin: 6px 6px 6px 0;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        h1, h2 {
            color: #183153;
        }
    </style>
</head>

<body>

    <h1>Capteurs du smartphone</h1>

    <button id="go">1. Activer les capteurs</button>

    <pre id="out">En attente... (appuyez sur le bouton)</pre>

    <h2>Test de dérive (10 s)</h2>

    <p>Posez le téléphone immobile sur la table, puis appuyez.</p>

    <button id="derive">2. Lancer le test de dérive</button>

    <pre id="res">Résultat : -</pre>

    <script>
        // ==========================================
        // 1. LECTURE DE L'ORIENTATION ET ACCÉLÉRATION
        // ==========================================

        const out = document.getElementById('out');

        // Orientation en degrés
        let o = {
            a: null,
            b: null,
            g: null
        };

        // Accélération avec gravité (m/s²)
        let acc = {
            x: null,
            y: null,
            z: null
        };

        // Accélération linéaire sans gravité (m/s²)
        let lin = {
            x: 0,
            y: 0,
            z: 0
        };

        // Demander les permissions nécessaires
        async function demanderPermissions() {

            // iPhone (iOS 13+) : permission après un clic
            if (
                typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function'
            ) {
                const r = await DeviceOrientationEvent.requestPermission();

                if (r !== 'granted') {
                    throw new Error('Permission orientation refusée');
                }
            }

            if (
                typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function'
            ) {
                const r = await DeviceMotionEvent.requestPermission();

                if (r !== 'granted') {
                    throw new Error('Permission mouvement refusée');
                }
            }
        }

        // Formater les valeurs
        function f(v) {
            return v == null ? 'n/a' : v.toFixed(1).padStart(7);
        }

        // Afficher les données sur la page
        function afficher() {

            const norme = Math.hypot(
                acc.x || 0,
                acc.y || 0,
                acc.z || 0
            );

            out.textContent =
                'ORIENTATION (degrés)\n' +
                ' alpha (cap)           : ' + f(o.a) + '\n' +
                ' beta (avant/arrière)  : ' + f(o.b) + '\n' +
                ' gamma (gauche/droite) : ' + f(o.g) + '\n\n' +

                'ACCÉLÉRATION (m/s²)\n' +
                ' x : ' + f(acc.x) + '\n' +
                ' y : ' + f(acc.y) + '\n' +
                ' z : ' + f(acc.z) + '\n' +
                ' norme : ' + norme.toFixed(2);
        }

        // Bouton d'activation des capteurs
        const boutonGo = document.getElementById('go');

        let capteursActifs = false;
        let affichageTimer = null;

        boutonGo.onclick = async () => {

            if (capteursActifs) return;

            try {
                await demanderPermissions();

                // Écouter les changements d'orientation
                window.addEventListener('deviceorientation', e => {

                    o = {
                        a: e.alpha,
                        b: e.beta,
                        g: e.gamma
                    };

                });

                // Écouter les mouvements du téléphone
                window.addEventListener('devicemotion', e => {

                    // Accélération avec gravité
                    if (e.accelerationIncludingGravity) {

                        acc = {
                            x: e.accelerationIncludingGravity.x,
                            y: e.accelerationIncludingGravity.y,
                            z: e.accelerationIncludingGravity.z
                        };
                    }

                    // Accélération linéaire sans gravité
                    if (
                        e.acceleration &&
                        e.acceleration.x != null
                    ) {

                        lin = {
                            x: e.acceleration.x,
                            y: e.acceleration.y,
                            z: e.acceleration.z
                        };
                    }

                    traiterDerive();

                });

                capteursActifs = true;
                boutonGo.disabled = true;
                boutonGo.textContent = 'Capteurs activés';

                // Actualiser l'affichage toutes les 100 ms
                affichageTimer = setInterval(afficher, 100);

            } catch (e) {

                out.textContent = 'Erreur : ' + e.message;

            }
        };


        // ==========================================
        // 2. TEST DE DÉRIVE : DOUBLE INTÉGRATION
        // ==========================================

        let derive = null;

        const res = document.getElementById('res');
        const boutonDerive = document.getElementById('derive');

        function traiterDerive() {

            if (!derive) return;

            const t = performance.now() / 1000;

            const dt = t - derive.tPrev;

            derive.tPrev = t;

            const a = [
                lin.x,
                lin.y,
                lin.z
            ];

            // Calcul de la vitesse et de la position
            for (let i = 0; i < 3; i++) {

                // Vitesse = intégrale de l'accélération
                derive.v[i] += a[i] * dt;

                // Position = intégrale de la vitesse
                derive.p[i] += derive.v[i] * dt;
            }

            const reste = 10 - (t - derive.t0);

            if (reste <= 0) {

                // Distance en centimètres
                const d = Math.hypot(...derive.p) * 100;

                res.textContent =
                    'Après 10 s IMMOBILE, le téléphone "croit" avoir bougé de ' +
                    d.toFixed(0) + ' cm.';

                derive = null;
                boutonDerive.disabled = false;

            } else {

                res.textContent =
                    'Mesure en cours... ' + reste.toFixed(1) + ' s';
            }
        }

        // Bouton de lancement du test de dérive
        boutonDerive.onclick = () => {

            if (!capteursActifs) {

                res.textContent =
                    'Veuillez d’abord activer les capteurs.';

                return;
            }

            if (derive) return;

            const t = performance.now() / 1000;

            derive = {
                t0: t,
                tPrev: t,
                v: [0, 0, 0],
                p: [0, 0, 0]
            };

            boutonDerive.disabled = true;

            res.textContent =
                'Mesure en cours... 10 s (ne touchez plus le téléphone)';
        };

    </script>

</body>
</html>
